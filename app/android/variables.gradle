ext {
    // Play requires new apps to target a recent API and the bar moves every
    // August, so check it before each release:
    // https://developer.android.com/google/play/requirements/target-sdk
    //
    // Capacitor 6 ships 34, which is well below the floor now. Compiling
    // against 36 needs a newer toolchain than Capacitor 6 brings — AGP 8.2.1
    // warns it was only tested to 34 — so build.gradle and the Gradle wrapper
    // are on AGP 8.9.1 / Gradle 8.13 rather than suppressing that warning.
    //
    // 35 and up opt into enforced edge-to-edge drawing. The safe-area CSS in
    // the built page already handles it, but that is the thing to look at
    // first if the status bar ever overlaps the header on a real device.
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}