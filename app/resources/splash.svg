<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <!-- The launch screen is shown for well under a second and is cropped hard
       on every aspect ratio going, so it is the wordmark on the mat and
       nothing else. Anything detailed here is detail nobody sees. -->
  <rect width="2732" height="2732" fill="#1E2A26"/>
  <g transform="translate(1366 1366)">
    <g stroke="#A87F4E" stroke-width="7">
      <rect x="-330" y="-180" width="300" height="105" fill="#D9B382"/>
      <rect x="-30"  y="-180" width="360" height="105" fill="#C08653"/>
      <rect x="-330" y="-75"  width="200" height="105" fill="#C08653"/>
      <rect x="-130" y="-75"  width="340" height="105" fill="#D9B382"/>
      <rect x="210"  y="-75"  width="120" height="105" fill="#86AE8E"/>
      <rect x="-330" y="30"   width="390" height="105" fill="#D9B382"/>
      <rect x="60"   y="30"   width="270" height="105" fill="#C08653"/>
    </g>
    <circle cx="-330" cy="-180" r="34" fill="#E8B04B" stroke="#1E2A26" stroke-width="12"/>
    <text x="0" y="290" fill="#EDEFE8" font-family="Bricolage Grotesque, Verdana, sans-serif"
          font-weight="800" font-size="118" text-anchor="middle"
          letter-spacing="-3">Plank Plan</text>
  </g>
</svg>
